</style><section class="ae-scope"><section class="ae-guide"><div class="ae-head"><div class="ae-orb">؟</div><p class="ae-kicker">راهنمای کامل آسمان</p><h2>هر سؤال، شروع یک مسیر روشن است.</h2><p>تمامی نکات مهمی که باید درباره طراحی سایت در مشهد بدانید، از تعرفه و انواع سایت تا فناوری، فرایند همکاری و کسب‌وکارهای مناسب.</p></div><div class="ae-explorer"><div class="ae-topics" data-topics></div><article class="ae-detail"><div class="ae-detail-top"><span>موضوع انتخاب‌شده</span><b class="ae-index" data-index></b></div><h3 data-title></h3><p data-content></p></article></div></section><section class="ae-faq"><div class="ae-faq-inner"><div class="ae-faq-title"><div class="ae-orb">؟</div><p class="ae-kicker">پاسخ به تردیدها</p><h2>سوالات متداول</h2><p>سوالاتی که ممکن است برای شما پیش‌آید</p></div><div class="ae-faq-card"><div class="ae-faq-bar"><span>پرسش‌های شما</span><span>•••</span></div><div data-faq></div></div></div></section></section><script>(function(){const data={"topics":[{"title":"مقدمه","content":"تصور کنید کسب‌وکار شما یک فروشگاه در بهترین نقطه مشهد دارد، اما هیچ تابلویی ندارد و مشتریان نمی‌توانند آن را پیدا کنند. امروزه بسیاری از کسب‌وکارهایی که حاضر به داشتن وب‌سایت نیستند، با شرایط مشابه مواجه‌اند. یک وب‌سایت حرفه‌ای دقیقاً همان تابلویی است که حضور آنلاین شما را به دیگران معرفی می‌کند. در دنیای دیجیتال، داشتن یک سایت اختصاصی و استاندارد نه‌تنها اعتبار برند شما را افزایش می‌دهد، بلکه مشتریان جدیدی را نیز جذب می‌کند. گروه نرم‌افزاری آسمان با سال‌ها تجربه در طراحی سایت در مشهد، راهکاری متفاوت برای کسب‌وکارهای کوچک و بزرگ ارائه می‌دهد. این تیم با طراحی خلاقانه، بهینه‌سازی برای موتورهای جست‌وجو و رعایت اصول تجربه کاربری، وب‌سایتی ایجاد می‌کند که هم زیباست و هم کاربردی. پشتیبانی قوی، امنیت بالا و واکنش‌گرایی کامل، از دیگر مزایای همکاری با این مجموعه است."},{"title":"تعرفه طراحی سایت در مشهد","content":"تعرفه‌های طراحی سایت اختصاصی در مشهد به عوامل مختلفی بستگی دارد و نمی‌توان یک قیمت ثابت برای همه پروژه‌ها در نظر گرفت. هزینه طراحی سایت به نوع وب‌سایت، امکانات مورد نیاز مانند درگاه پرداخت، پنل مدیریت و چت آنلاین، میزان سفارشی‌سازی، طراحی گرافیکی اختصاصی و بهینه‌سازی برای موتورهای جست‌وجو بستگی دارد. قیمت طراحی اختصاصی ممکن است نسبت به استفاده از قالب‌های آماده بیشتر باشد؛ اما به دلیل بازدهی بالای سایت‌های اختصاصی، این هزینه در مدت زمان کوتاهی می‌تواند به سوددهی کسب‌وکار کمک کند. گروه نرم‌افزاری آسمان قیمت‌های منصفانه و متناسب با نیاز مشتریان ارائه می‌دهد."},{"title":"آشنایی با انواع سایت‌ها","content":"وب‌سایت‌ها با اهداف و کاربردهای متفاوتی طراحی می‌شوند. وب‌سایت فروشگاهی برای فروش آنلاین محصولات و امکاناتی مانند سبد خرید، درگاه پرداخت و جست‌وجوی پیشرفته است. وب‌سایت شرکتی برای معرفی برند، خدمات و محصولات یک کسب‌وکار طراحی می‌شود. سایت معرفی نمونه‌کار برای نمایش رزومه و پروژه‌های افراد حرفه‌ای مناسب است. سایت بلاگی به انتشار مقاله، ویدیو و تصویر می‌پردازد. سایت خبری و مجله‌ای بر انتشار اخبار و رویدادهای روز تمرکز دارد و سایت آموزشی برای ارائه دوره‌ها یا معرفی مؤسسات آموزشی استفاده می‌شود. انتخاب نوع مناسب سایت تأثیر زیادی بر موفقیت آنلاین شما خواهد داشت."},{"title":"چرا طراحی سایت با کدنویسی؟","content":"برای طراحی سایت دو روش کلی پیش روی شما قرار دارد: استفاده از قالب‌های آماده و طراحی اختصاصی با کدنویسی. قالب‌های آماده سریع و ارزان هستند، اما در سفارشی‌سازی، امنیت و بهینه‌سازی محدودیت دارند. در مقابل، طراحی اختصاصی با کدنویسی دقیقاً مطابق با نیاز شما ساخته می‌شود و از ابتدا برای سرعت بالا، امنیت بیشتر و سئو طراحی می‌شود. چنین سایتی انعطاف‌پذیری بیشتری دارد، قابلیت‌های تازه را در آینده می‌پذیرد و تجربه کاربری آن براساس نیاز مخاطبان هدف برنامه‌ریزی می‌شود."},{"title":"سفارشی‌سازی کامل","content":"هر کسب‌وکاری نیازهای خاص خود را دارد و یک وب‌سایت عمومی همیشه پاسخگوی این نیازها نیست. با طراحی سایت اختصاصی می‌توان طراحی گرافیکی، پنل مدیریتی، فیلترهای جست‌وجوی سفارشی، سیستم‌های پرداخت خاص و تعاملات ویژه با کاربران را دقیقاً مطابق با نیاز کسب‌وکار پیاده‌سازی کرد. این سطح از سفارشی‌سازی تجربه کاربری و بهره‌وری را بهتر می‌کند و به متمایز شدن از رقبا کمک می‌رساند."},{"title":"بهینه‌سازی عملکرد و امنیت بالا","content":"عملکرد سریع و روان یک وب‌سایت، نقش مستقیمی در تجربه کاربری و رضایت مشتریان دارد. در طراحی اختصاصی فقط کدهای ضروری استفاده می‌شوند و بهینه‌سازی دیتابیس و مدیریت درخواست‌ها با دقت بیشتری انجام می‌شود. از سوی دیگر، امنیت برای کسب‌وکارهایی که با اطلاعات مشتریان سروکار دارند ضروری است. استفاده از پروتکل‌های امنیتی قوی، مدیریت دسترسی، رمزگذاری داده‌ها، فایروال و گواهی SSL در طراحی اختصاصی امکان‌پذیر است و به کاهش آسیب‌پذیری‌های رایج کمک می‌کند."},{"title":"انعطاف‌پذیری، فناوری و پشتیبانی فنی","content":"یک وب‌سایت موفق باید همراه با رشد کسب‌وکار توسعه یابد. سایت اختصاصی اجازه می‌دهد امکانات و ویژگی‌های جدید بدون محدودیت اضافه شوند. امکان سازگاری با فرآیندهای کاری خاص، اتصال به نرم‌افزارهای سازمانی و استفاده از فناوری‌های جدید نیز فراهم است. مدیریت بهینه منابع، کاهش هزینه‌های نگهداری و دسترسی به پشتیبانی فنی متناسب با کدهای سایت از دیگر مزیت‌های این رویکرد است."},{"title":"نمونه کارها و پروژه‌های قبلی","content":"انتخاب یک تیم حرفه‌ای برای طراحی سایت، بدون بررسی نمونه‌کارهای قبلی دشوار است. تیم طراحی سایت در مشهد با تجربه در حوزه‌های آموزشی، خودرویی، فروشگاهی، پزشکی و صنعتی، پروژه‌های متنوعی را اجرا کرده است. هدف ما ایجاد سایت‌هایی است که علاوه بر زیبایی بصری، عملکردی قدرتمند و تجربه کاربری ایده‌آل ارائه دهند. در بخش نمونه‌کارها می‌توانید کیفیت طراحی و امکانات پروژه‌ها را بررسی کنید."},{"title":"چرا گروه نرم‌افزاری آسمان؟","content":"گروه نرم‌افزاری آسمان با تمرکز بر طراحی اختصاصی، امنیت بالا، عملکرد سریع و تجربه کاربری بهینه، سایت‌هایی متناسب با نیازهای مشتریان ارائه می‌دهد. تیمی متخصص در برنامه‌نویسی، طراحی UI/UX، سئو، تولید محتوا و امنیت وب، استفاده از فناوری‌های جدید، قیمت‌های رقابتی و پشتیبانی تخصصی را در کنار هم قرار می‌دهد تا وب‌سایت شما استاندارد، متمایز و قابل رشد باشد."},{"title":"مراحل و نحوه همکاری با ما","content":"طراحی یک وب‌سایت حرفه‌ای نیازمند برنامه‌ریزی دقیق و اجرای مرحله‌به‌مرحله است. فرایند همکاری شامل تحلیل نیازها و مشاوره، طراحی مفهومی و رابط کاربری، کدنویسی و توسعه، تست و عیب‌یابی، بازبینی و تأیید نهایی و تحویل رسمی به کارفرما است. در هر مرحله، شما با تیم در ارتباط خواهید بود تا سایت دقیقاً مطابق با انتظاراتتان پیاده‌سازی شود. پس از تحویل نیز آموزش مدیریت سایت و پشتیبانی فنی ارائه می‌شود."},{"title":"ویژگی‌های یک سایت حرفه‌ای و موفق در مشهد","content":"یک سایت موفق ترکیبی از زیبایی، عملکرد و تجربه کاربری عالی است. طراحی واکنش‌گرا، سئو و بهینه‌سازی برای گوگل، امنیت و سرعت بارگذاری، و تجربه کاربری ساده و روان از مهم‌ترین ویژگی‌های یک وب‌سایت حرفه‌ای هستند. چنین سایتی هم برای موتورهای جست‌وجو قابل درک است و هم به کاربر کمک می‌کند با کمترین سردرگمی به هدف خود برسد."},{"title":"طراحی سایت در مشهد برای چه کسب‌وکارهایی مناسب است؟","content":"هر جایی که مشتری هست، اینترنت هم حضور دارد. فروشگاه‌های اینترنتی، شرکت‌ها و کارخانه‌ها، پزشکان و کلینیک‌ها، مراکز خدماتی، آموزشگاه‌ها و مؤسسات آموزشی می‌توانند با یک سایت حرفه‌ای اعتبار خود را افزایش دهند و خدمات یا محصولاتشان را بدون محدودیت زمان و مکان معرفی کنند. سایت فروشگاهی به درگاه پرداخت امن و طراحی کاربرپسند نیاز دارد؛ سایت شرکتی به معرفی دقیق خدمات و رزومه؛ سایت پزشکی به دسترسی آسان به خدمات و وقت‌دهی؛ و سایت آموزشی به ساختاری منظم برای دوره‌ها و ثبت‌نام."},{"title":"چرا به سایت نیاز داریم؟","content":"امروزه، حضور آنلاین برای هر کسب‌وکاری امری حیاتی است. وب‌سایت شما نه تنها کارت ویزیت دیجیتال است، بلکه فرصتی طلایی برای معرفی برند و خدمات شما به هزاران نفر است. با داشتن یک سایت حرفه‌ای، می‌توانید ارتباط خود را با مشتریان تقویت کرده و فروش خود را به طور چشمگیری افزایش دهید. یک وب‌سایت مناسب، شما را همیشه در دسترس می‌سازد و حتی در ساعات غیرکاری هم می‌توانید به راحتی محصولات و خدمات خود را به فروش برسانید. به‌ویژه در مشهد، جایی که رقابت در دنیای آنلاین شدیدتر از همیشه است، طراحی سایت در مشهد می‌تواند عامل تمایز شما از رقبا باشد. چه قصد راه‌اندازی یک طراحی سایت فروشگاهی در مشهد را داشته باشید، چه یک وب‌سایت شرکتی، داشتن یک سایت حرفه‌ای و کاربرپسند می‌تواند شما را به هدف‌تان نزدیک‌تر کند و مشتریان جدیدی جذب کنید. گروه نرم‌افزاری آسمان با تجربه‌ای چندین ساله، به شما کمک می‌کند تا در دنیای دیجیتال یک قدم جلوتر باشید."},{"title":"چرا طراحی سایت اختصاصی بهتر است؟","content":"در دنیای امروز، داشتن یک سایت اختصاصی به شما این امکان را می‌دهد که یک وب‌سایت کاملاً منحصر به فرد و مطابق با نیازهای کسب‌وکار خود داشته باشید. برخلاف قالب‌های آماده که ممکن است محدودیت‌هایی در عملکرد و طراحی داشته باشند، سایت اختصاصی به شما اجازه می‌دهد تا ویژگی‌هایی دقیقاً متناسب با برند و اهداف خود ایجاد کنید. این نوع طراحی نه تنها به شما کنترل کامل بر ظاهر و عملکرد سایت می‌دهد، بلکه از نظر سئو و عملکرد نیز بهینه‌تر خواهد بود. به علاوه، یک سایت اختصاصی به شما این امکان را می‌دهد که در صورت نیاز، امکانات جدید را به راحتی اضافه کنید و سایت خود را گسترش دهید. سرمایه‌گذاری در یک سایت حرفه‌ای و منحصر به فرد به شما کمک می‌کند تا در درازمدت بازگشت سرمایه بیشتری داشته باشید و تجربه کاربری بهتری برای مشتریان ایجاد کنید."},{"title":"چرا گروه نرم‌افزاری آسمان را انتخاب کنیم؟","content":"انتخاب یک تیم متخصص برای طراحی سایت می‌تواند تفاوت زیادی در موفقیت آنلاین شما ایجاد کند. گروه نرم‌افزاری آسمان با تجربه چندین ساله در طراحی وب‌سایت‌های حرفه‌ای و متناسب با نیازهای کسب‌وکارها، برای کسانی است که می‌خواهند حضوری مؤثر و موفق در فضای دیجیتال داشته باشند. هدف ما این است که در کنار ارائه طراحی‌های مدرن و خلاقانه، سایتی کارآمد، سئو‌محور و سریع به شما تحویل دهیم. پشتیبانی حرفه‌ای، مشاوره‌های مفید و به‌روزرسانی‌های مداوم، از ایده‌پردازی تا اجرای کامل، در کنار شماست تا بهترین وب‌سایت را با توجه به نیازهای خاص کسب‌وکارتان ایجاد کنیم."},{"title":"مزیت‌های آسمان در یک نگاه","content":"تیمی متخصص و باتجربه، طراحی سفارشی و منحصر‌به‌فرد، سرعت بارگذاری بالا، تجربه کاربری بهبود یافته، تضمین امنیت، استفاده از جدیدترین فناوری‌ها و قیمت رقابتی و ارزش بالا از مهم‌ترین نقاط قوت گروه نرم‌افزاری آسمان هستند. اعضای تیم در برنامه‌نویسی، طراحی UI/UX، سئو، تولید محتوای متنی و امنیت وب تخصص دارند. ساختار منظم، دسترسی آسان، ناوبری ساده و طراحی واکنش‌گرا در پروژه‌ها رعایت می‌شود تا کاربران بدون سردرگمی از سایت استفاده کنند."},{"title":"سازگاری با نیازهای خاص کسب‌وکار","content":"هر کسب‌وکار نیازهای منحصربه‌فردی دارد که در قالب‌های آماده به‌درستی پوشش داده نمی‌شوند. طراحی سایت اختصاصی این امکان را می‌دهد که امکانات و ویژگی‌های سایت کاملاً مطابق با اهداف و فرآیندهای کاری شما پیاده‌سازی شوند. از قابلیت‌های خاص مانند پنل مدیریت سفارشی، سیستم‌های اتوماسیون داخلی، درگاه‌های پرداخت متنوع و تعاملات خاص با کاربران گرفته تا یکپارچه‌سازی با سایر نرم‌افزارهای سازمانی، همه این موارد در طراحی اختصاصی قابل اجرا هستند."},{"title":"استفاده از تکنولوژی‌های جدید و مدیریت بهتر منابع","content":"با پیشرفت روزافزون فناوری، استفاده از تکنولوژی‌های جدید در طراحی سایت اهمیت زیادی دارد. طراحی سایت به صورت اختصاصی این امکان را فراهم می‌کند که از جدیدترین زبان‌های برنامه‌نویسی، فریمورک‌ها و ابزارهای بهینه‌سازی عملکرد استفاده شود. تکنولوژی‌هایی مانند هوش مصنوعی، پردازش ابری و Progressive Web Apps در سایت‌های اختصاصی راحت‌تر قابل استفاده هستند. در طراحی اختصاصی، منابع سرور و دیتابیس نیز بهینه‌تر مدیریت می‌شوند؛ فقط امکانات مورد نیاز کسب‌وکار ساخته می‌شوند، مصرف منابع کاهش می‌یابد و سایت می‌تواند ترافیک بالاتر را بدون افت کیفیت مدیریت کند."},{"title":"فرایند اجرا: تحلیل نیازها و طراحی مفهومی","content":"اولین قدم در طراحی سایت، شناخت دقیق نیازهای کسب‌وکار و اهداف شماست. تیم گروه نرم‌افزاری آسمان با برگزاری جلسات مشاوره و بررسی دقیق انتظارات شما، تحلیل جامعی از نیازهای پروژه انجام می‌دهد. پس از مشخص شدن نیازها، مرحله طراحی رابط کاربری و تجربه کاربری آغاز می‌شود. چیدمان صفحات، انتخاب رنگ‌بندی، طراحی دکمه‌ها، تصاویر و عناصر بصری بررسی می‌شوند تا تجربه‌ای جذاب، کاربرپسند و استاندارد ایجاد شود و شما بتوانید نظرات و پیشنهادهای خود را پیش از توسعه نهایی اعمال کنید."},{"title":"فرایند اجرا: کدنویسی، تست و تحویل","content":"پس از تأیید طراحی رابط کاربری، نوبت به کدنویسی و توسعه وب‌سایت می‌رسد. فرانت‌اند، بک‌اند، سیستم مدیریت محتوا، فرم‌های تماس، درگاه پرداخت و امکانات مورد نیاز در این مرحله توسعه می‌یابند. پس از آن تمامی بخش‌ها از نظر لینک‌ها، فرم‌ها، واکنش‌گرایی در دستگاه‌های مختلف، امنیت و سازگاری با مرورگرها تست و عیب‌یابی می‌شوند. پس از بازبینی نهایی و دریافت تأیید کارفرما، سایت روی هاست اصلی بارگذاری، دامنه متصل و آموزش مدیریت ارائه می‌شود. پشتیبانی فنی و مشاوره پس از تحویل نیز ادامه خواهد داشت."},{"title":"ویژگی‌های یک سایت حرفه‌ای و موفق","content":"طراحی واکنش‌گرا، سئو و بهینه‌سازی برای گوگل، امنیت و سرعت بارگذاری و تجربه کاربری عالی از ویژگی‌های اصلی یک سایت حرفه‌ای هستند. سایت باید روی موبایل، تبلت و دسکتاپ بدون به‌هم‌ریختگی نمایش داده شود. با بهینه‌سازی محتوا، سرعت و ساختار سایت، امکان دیده‌شدن در نتایج جست‌وجو بیشتر می‌شود. سایت امن و سریع، کاربران را حفظ می‌کند و طراحی ساده و روان کمک می‌کند بازدیدکننده به‌راحتی به هدف خود برسد و دوباره به سایت بازگردد."},{"title":"فروشگاه‌های اینترنتی در مشهد","content":"بازار آنلاین مشهد هر روز داغ‌تر می‌شود. بسیاری از فروشگاه‌ها با طراحی سایت فروشگاهی در مشهد توانسته‌اند فروش خود را چند برابر کنند و مشتریانشان را از سطح شهر فراتر ببرند. سایت فروشگاهی حرفه‌ای باید سرعت بالا، درگاه پرداخت امن و طراحی کاربرپسند داشته باشد تا تجربه خریدی راحت فراهم کند. با داشتن یک سایت فروشگاهی حرفه‌ای، کسب‌وکار شما همیشه در دسترس مشتریان قرار دارد و محدودیت‌های زمانی و مکانی را از بین می‌برد."},{"title":"شرکت‌ها، کارخانه‌ها، پزشکان و مراکز خدماتی","content":"مجموعه‌های صنعتی می‌توانند محصولات، خدمات و توانمندی‌های خود را به مشتریان داخلی و خارجی معرفی کنند و با یک سایت شرکتی رسمی، سریع و دارای بخش‌های دقیق درباره معرفی شرکت، رزومه و اطلاعات تماس اعتبار بسازند. پزشکان و کلینیک‌ها نیز می‌توانند رزومه خود را نمایش دهند، وقت‌دهی آنلاین ارائه کنند و با بیماران در ارتباط باشند. یک سایت بهینه از نظر سئو و امنیت، پلی میان تخصص و نیاز مخاطب است و دسترسی سریع به اطلاعات و خدمات مورد نیاز را فراهم می‌کند."},{"title":"آموزشگاه‌ها و مؤسسات آموزشی در مشهد","content":"دنیای آموزش دیگر فقط در کلاس‌ها خلاصه نمی‌شود. آموزشگاه‌ها می‌توانند دوره‌ها، اساتید و خدمات آموزشی خود را به‌صورت آنلاین معرفی کنند و حتی ثبت‌نام اینترنتی داشته باشند. یک سایت آموزشی خوب باید محیطی منظم، ساده و سریع داشته باشد تا دانشجو یا هنرجو به راحتی اطلاعات مورد نیازش را پیدا کند. با یک سایت حرفه‌ای، آموزشگاه‌ها جایگاه خود را میان رقبا تثبیت می‌کنند و مخاطبان تازه‌ای از سراسر کشور جذب خواهند کرد."}],"faqs":[{"question":"هزینه طراحی سایت در مشهد چقدر است؟","answer":"هزینه طراحی سایت بسته به نوع وب‌سایت، امکانات مورد نیاز و میزان سفارشی‌سازی متفاوت است و معمولاً از چند میلیون تومان شروع می‌شود."},{"question":"مدت زمان طراحی سایت چقدر طول می‌کشد؟","answer":"زمان اجرا با توجه به دامنه پروژه، تعداد صفحه‌ها و امکانات مورد نیاز تعیین می‌شود. پس از جلسه تحلیل نیاز و مشخص شدن جزئیات، زمان‌بندی مرحله‌ای و شفاف پروژه را ارائه می‌کنیم تا مسیر طراحی، توسعه، تست و تحویل قابل پیگیری باشد."},{"question":"آیا وب‌سایت‌ها بهینه‌سازی شده برای سئو تحویل داده می‌شوند؟","answer":"بله. ساختار فنی سایت با توجه به اصول پایه سئو، سرعت بارگذاری، نمایش درست در موبایل، ساختار عنوان‌ها و امکان توسعه محتوایی طراحی می‌شود. برنامه سئو و تولید محتوای مداوم می‌تواند پس از راه‌اندازی، به‌صورت جداگانه ادامه پیدا کند."},{"question":"بعد از طراحی سایت، پشتیبانی هم ارائه می‌دهید؟","answer":"بله. پس از تحویل، آموزش مدیریت بخش‌های قابل ویرایش و پشتیبانی فنی مورد نیاز ارائه می‌شود. برای تغییرات، بهبود عملکرد، توسعه قابلیت‌های تازه و نگهداری دوره‌ای نیز می‌توانید روی همراهی تیم آسمان حساب کنید."},{"question":"آیا امکان افزودن امکانات جدید به سایت در آینده وجود دارد؟","answer":"بله. ساختار سایت اختصاصی به‌گونه‌ای طراحی می‌شود که همراه با رشد کسب‌وکار توسعه پیدا کند. اتصال به درگاه پرداخت، سامانه پیامک، CRM، گزارش‌گیری، فرم‌های جدید یا هر قابلیت متناسب با فرایند کاری شما در آینده قابل برنامه‌ریزی و اجراست."}]},pad=n=>String(n+1).padStart(2,"0"),root=document.querySelector(".ae-scope"),topicBox=root.querySelector("[data-topics]"),title=root.querySelector("[data-title]"),content=root.querySelector("[data-content]"),index=root.querySelector("[data-index]");function select(i){title.textContent=data.topics[i].title;content.textContent=data.topics[i].content;index.textContent=pad(i);topicBox.querySelectorAll("button").forEach((b,n)=>b.classList.toggle("active",n===i))}data.topics.forEach((topic,i)=>{const b=document.createElement("button");b.type="button";b.className="ae-topic";b.innerHTML="<b>"+pad(i)+"</b><span></span>";b.querySelector("span").textContent=topic.title;b.onclick=()=>select(i);topicBox.appendChild(b)});select(0);const faqBox=root.querySelector("[data-faq]");data.faqs.forEach((faq,i)=>{const d=document.createElement("details");d.className="ae-faq-item";d.open=i===0;d.innerHTML="<summary><span class='ae-index'>"+pad(i)+"</span><span></span><b>+</b></summary><p class='ae-answer'></p>";d.querySelector("summary span:nth-child(2)").textContent=faq.question;d.querySelector("p").textContent=faq.answer;faqBox.appendChild(d)})})();</script>
